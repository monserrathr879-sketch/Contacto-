<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* ESTILO PARA EL MENSAJE QUE APARECE */
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4fd;
            border-radius: 8px;
            display: none; /* Empieza oculto */
            text-align: left;
        }

        #resultado p {
            margin: 5px 0;
            color: #2c3e50;
        }

        .frase {
            margin-top: 10px;
            font-style: italic;
            color: #007bff;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <form id="formulario">
        <h2>Formulario de Contacto</h2>

        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
        </div>

        <div class="campo">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <button type="submit">Enviar</button>

        <!-- AQUÍ SALDRÁN LOS DATOS Y LA FRASE -->
        <div id="resultado">
            <p><strong>✅ Datos enviados correctamente:</strong></p>
            <p>👤 Nombre: <span id="nombreMostrado"></span></p>
            <p>🧑 Apellido: <span id="apellidoMostrado"></span></p>
            <p>📞 Teléfono: <span id="telefonoMostrado"></span></p>
            <p class="frase">"¡Gracias por contactarnos! Estamos felices de tenerte cerca." 💙✨</p>
        </div>
    </form>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que se recargue la página

            // Obtener los valores de los inputs
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const telefono = document.getElementById('telefono').value;

            // Mostrar los datos en pantalla
            document.getElementById('nombreMostrado').textContent = nombre;
            document.getElementById('apellidoMostrado').textContent = apellido;
            document.getElementById('telefonoMostrado').textContent = telefono;

            // Hacer visible el mensaje
            resultado.style.display = 'block';
        });
    </script>

</body>
</html>
